name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Go modules are published by tag, so tagging the release is all it takes;
      # proxy.golang.org picks the version up on first fetch.
      - name: Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GH_TOKEN }}
